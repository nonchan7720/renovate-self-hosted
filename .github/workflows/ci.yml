name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the Go and golangci-lint versions pinned in mise.toml.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Lint
        run: golangci-lint run

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "gofmt needs to run on:"
            echo "${unformatted}"
            exit 1
          fi

  chart:
    name: Lint helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Lint chart
        run: |
          helm lint deploy/helm/renovate-webhook \
            --set config.runnerRepository=acme/renovate-runner \
            --set secret.webhookSecret=example \
            --set secret.githubToken=example

      - name: Render chart
        run: |
          # Minimal install, and everything switched on, so a template that
          # only breaks under one of them cannot slip through.
          helm template renovate-webhook deploy/helm/renovate-webhook \
            --set config.runnerRepository=acme/renovate-runner \
            --set secret.webhookSecret=example \
            --set secret.githubToken=example > /dev/null
          helm template renovate-webhook deploy/helm/renovate-webhook \
            --set config.runnerRepository=acme/renovate-runner \
            --set secret.existingSecret=renovate-webhook \
            --set ingress.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set replicaCount=2 > /dev/null

  docker:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --tag renovate-webhook:ci .
